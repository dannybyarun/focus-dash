<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio — crypto portfolio tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
  :root{--bg:#0b0f14;--card:#121a23;--line:#223041;--inset:#0e1520;--text:#e6edf3;--dim:#8b98a5;--accent:#7dd3fc;--up:#4ade80;--down:#f87171}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{max-width:760px;margin:0 auto;padding:22px 16px 8px;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:20px;margin:0} h1 a{color:var(--dim);text-decoration:none;font-size:13px;margin-left:10px} h1 a:hover{color:var(--accent)}
  main{max-width:760px;margin:0 auto;padding:14px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .label{color:var(--dim);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
  .total{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .up{color:var(--up)} .down{color:var(--down)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .sym{font-weight:700}
  .amt{color:var(--dim);font-size:12px}
  .grow{flex:1;min-width:0}
  .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
  .chg{font-size:12px;text-align:right;white-space:nowrap;min-width:74px}
  .spark{width:110px;height:30px;flex:0 0 auto}
  form{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  input,select{background:var(--inset);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=number]{width:110px}
  .mini{background:var(--inset);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;padding:4px}
  .x:hover{color:var(--down)}
  .hint{color:var(--dim);font-size:11.5px;margin-top:8px}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:14px}
  footer a{color:var(--dim)}
  .err{color:var(--down);font-size:13px}
</style>
</head>
<body>
<header><h1>📈 Folio<a href="/">focus ↗</a><a href="/apps.html">📱 apps ↗</a></h1></header>
<main>
  <div class="card">
    <div class="label">Total value</div>
    <div class="total" id="total">…</div>
    <div class="sub" id="totalchg"></div>
  </div>
  <div class="card">
    <form id="add">
      <select id="coin"></select>
      <input id="amt" type="number" step="any" min="0" placeholder="amount" required>
      <button class="mini" type="submit">＋ Add</button>
    </form>
    <div id="rows" style="margin-top:10px"></div>
    <div class="hint">holdings are saved in your browser only (localStorage) · prices + 7-day sparklines from coingecko.com · refreshes every 60s</div>
  </div>
</main>
<footer>pure client-side · <a href="/dashboard/">Dash XL ↗</a></footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const COINS=[["bitcoin","BTC"],["ethereum","ETH"],["solana","SOL"],["ripple","XRP"],["cardano","ADA"],
  ["dogecoin","DOGE"],["binancecoin","BNB"],["chainlink","LINK"],["polkadot","DOT"],["litecoin","LTC"],
  ["avalanche-2","AVAX"],["tron","TRX"],["shiba-inu","SHIB"],["uniswap","UNI"],["stellar","XLM"],["monero","XMR"]];
const SYM=Object.fromEntries(COINS);
let folio=[];try{folio=JSON.parse(localStorage.getItem("folio")||"[]");}catch(e){folio=[];}
if(!Array.isArray(folio))folio=[];
const save=()=>localStorage.setItem("folio",JSON.stringify(folio));
$("coin").innerHTML=COINS.map(([id,s])=>`<option value="${id}">${s}</option>`).join("");
function spark(vals,w=110,h=30){if(!vals||vals.length<2)return"";
  const step=Math.max(1,Math.floor(vals.length/40));const p=vals.filter((_,i)=>i%step===0||i===vals.length-1);
  const min=Math.min(...p),max=Math.max(...p),r=(max-min)||1,up=p[p.length-1]>=p[0];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="2" points="${p.map((v,i)=>`${(i/(p.length-1)*w).toFixed(1)},${(h-2-((v-min)/r)*(h-4)).toFixed(1)}`).join(" ")}"/></svg>`;}
const fmt=(n)=>Number(n).toLocaleString("en-US",{style:"currency",currency:"USD"});
async function render(){
  if(!folio.length){$("total").textContent=fmt(0);$("totalchg").textContent="add your first holding below ⬇️";$("rows").innerHTML=`<div class="hint">no holdings yet</div>`;return;}
  const ids=[...new Set(folio.map(h=>h.id))].join(",");
  try{
    const px=await (await fetch("https://api.coingecko.com/api/v3/simple/price?ids="+ids+"&vs_currencies=usd&include_24hr_change=true")).json();
    const mk=await (await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids="+ids+"&sparkline=true")).json();
    const sp={};(mk||[]).forEach(c=>sp[c.id]=c.sparkline_in_7d&&c.sparkline_in_7d.price);
    let total=0,prev=0,rows="";
    folio.forEach((h,i)=>{
      const e=px[h.id];if(!e)return;
      const val=(e.usd||0)*h.amt,p24=e.usd_24h_change==null?0:e.usd_24h_change;
      total+=val;prev+=val/(1+p24/100);
      rows+=`<div class="row">
        <div><div class="sym">${SYM[h.id]||h.id}</div><div class="amt">${h.amt} @ ${fmt(e.usd)}</div></div>
        <div class="grow">${spark(sp[h.id])}</div>
        <div><div class="val">${fmt(val)}</div><div class="chg ${p24>=0?"up":"down"}">${p24>=0?"▲":"▼"} ${Math.abs(p24).toFixed(2)}%</div></div>
        <button class="x" data-rm="${i}" title="remove">✕</button>
      </div>`;});
    $("rows").innerHTML=rows||`<div class="hint">no holdings yet</div>`;
    $("total").textContent=fmt(total);
    const d=prev?((total-prev)/prev*100):0;
    $("totalchg").innerHTML=`24h: <span class="${d>=0?"up":"down"}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(2)}%</span> · ${folio.length} coins · ${new Date().toLocaleTimeString()}`;
  }catch(e){$("totalchg").innerHTML=`<span class="err">⚠️ price fetch failed — retrying in 60s</span>`;}
}
$("add").addEventListener("submit",e=>{e.preventDefault();
  const id=$("coin").value,amt=parseFloat($("amt").value);
  if(!(amt>0))return;
  const ex=folio.find(h=>h.id===id);
  if(ex)ex.amt=+(ex.amt+amt).toFixed(8);else folio.push({id,amt});
  save();$("amt").value="";render();});
$("rows").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;
  folio.splice(+b.dataset.rm,1);save();render();});
render();setInterval(render,60e3);
</script>
</body>
</html>
