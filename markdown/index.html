<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Preview — PocketOS</title>
<link rel="stylesheet" href="/shared.css">
<style>
  body{padding:1rem 1.2rem}
  .center{max-width:1000px;margin:0 auto}
  .toolbar{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
  .toolbar button{padding:.5rem .9rem;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:.8rem}
  .toolbar button:hover{border-color:var(--accent)}
  .toolbar select{padding:.5rem .8rem;border-radius:8px;background:var(--inset);border:1px solid var(--line);color:var(--text)}
  .editor-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media (max-width:800px){ .editor-wrap{grid-template-columns:1fr} }
  .pane{display:flex;flex-direction:column}
  .pane label{font-size:.7rem;color:var(--dim);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.03em}
  textarea{flex:1;min-height:400px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem;line-height:1.6}
  #preview{flex:1;min-height:400px;padding:1.5rem;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
  #preview img{max-width:100%;height:auto;border-radius:6px}
  #preview pre{background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:1rem;overflow:auto}
  #preview code{font-family:ui-monospace,monospace;font-size:.85rem}
  #preview pre code{background:none;padding:0}
  #preview table{border-collapse:collapse;width:100%;margin:1rem 0}
  #preview th,#preview td{border:1px solid var(--line);padding:.5rem .8rem;text-align:left}
  #preview th{background:var(--inset)}
  #preview blockquote{border-left:3px solid var(--accent);padding-left:1rem;color:var(--dim);margin:1rem 0}
  #preview hr{border:none;border-top:1px solid var(--line);margin:1.5rem 0}
  .status{display:flex;gap:1rem;margin-top:.8rem;font-size:.75rem;color:var(--dim)}
  .sync-toggle{display:flex;align-items:center;gap:.4rem}
  .template-btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto}
  /* syntax highlight */
  .hljs{background:none!important}
  .hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name,.hljs-tag{color:#ff7b72}
  .hljs-string,.hljs-title,.hljs-section,.hljs-attribute,.hljs-literal,.hljs-template-tag,.hljs-template-variable,.hljs-type,.hljs-addition{color:#79c0ff}
  .hljs-comment,.hljs-quote,.hljs-deletion,.hljs-meta{color:#8b98a5}
  .hljs-number,.hljs-regexp,.hljs-symbol,.hljs-variable,.hljs-template-variable,.hljs-link{color:#ffa657}
  .hljs-function,.hljs-class,.hljs-title.class_{color:#d2a8ff}
</style>
</head>
<body>
  <div style="max-width:1000px;margin:0 auto;padding:1rem 1rem 0">
    <a href="/apps.html" style="color:var(--dim);font-size:.85rem;text-decoration:none">← PocketOS</a>
  </div>
  <div class="center">
    <div class="toolbar">
      <div class="template-btns" id="templates"></div>
      <select id="theme">
        <option value="github">GitHub Light</option>
        <option value="github-dark" selected>GitHub Dark</option>
        <option value="minimal">Minimal</option>
      </select>
      <button id="clearBtn">Clear</button>
      <button id="copyMd">Copy Markdown</button>
      <button id="copyHtml">Copy HTML</button>
      <button id="downloadBtn">Download .md</button>
      <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display:none">
      <button id="openBtn">Open File</button>
      <label class="sync-toggle"><input type="checkbox" id="syncScroll" checked> Sync scroll</label>
    </div>

    <div class="editor-wrap">
      <div class="pane">
        <label>Markdown</label>
        <textarea id="editor" spellcheck="false" placeholder="Start typing Markdown…"></textarea>
      </div>
      <div class="pane">
        <label>Preview</label>
        <div id="preview"></div>
      </div>
    </div>

    <div class="status">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 chars</span>
      <span id="lineCount">0 lines</span>
      <span id="readTime">0 min read</span>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);

const TEMPLATES = [
  {name:"Blank", content:""},
  {name:"README", content:`# Project Title

> A brief description of what this project does.

## Features

- Feature 1
- Feature 2
- Feature 3

## Installation

\`\`\`bash
npm install my-package
\`\`\`

## Usage

\`\`\`js

something.doCoolThing();
\`\`\`

## License

MIT
`},
  {name:"Changelog", content:`# Changelog

All notable changes to this project will be documented in this file.

## [Unreleased]

### Added
- New feature X

### Changed
- Improved performance of Y

### Fixed
- Bug in Z

## [1.0.0] - 2024-01-15

### Added
- Initial release
`},
  {name:"Meeting Notes", content:`# Meeting: [Title]

**Date:** ${new Date().toLocaleDateString()}
**Attendees:** Name, Name

## Agenda

1. Item 1
2. Item 2

## Notes

### Item 1
- Discussion point
- Action: @person to do thing

### Item 2
- Decision made

## Action Items

- [ ] Task 1 — @person
- [ ] Task 2 — @person
`},
  {name:"Blog Post", content:`# Blog Post Title

*Published: ${new Date().toLocaleDateString()}*

## Introduction

Hook the reader with an engaging opening.

## Main Section

Content goes here.

### Subsection

More details.

## Conclusion

Wrap up with a call to action.

---

*Tags: tag1, tag2*
`},
  {name:"Diary", content:`# ${new Date().toLocaleDateString()}

## Mood
😊 / 😐 / 😔

## What happened

-

## Grateful for

1.
2.
3.

## Tomorrow
-
`}
];

function renderTemplates(){
  $("templates").innerHTML = TEMPLATES.map((t,i)=>`<button data-i="${i}">${t.name}</button>`).join("");
  $("templates").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if($("editor").value.trim() && !confirm("Replace current content?")) return;
    $("editor").value = TEMPLATES[+b.dataset.i].content;
    update();
  });
}

/* --- Minimal Markdown Parser (CommonMark subset) --- */
function markdownToHtml(md){
  if(!md) return "";
  
  // Escape HTML first
  const esc = s => s.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
  
  let lines = md.split("\n");
  let html = "";
  let inCode = false;
  let codeLang = "";
  let codeBuffer = [];
  let inList = false;
  let listType = null;
  let inBlockquote = false;
  
  const closeCode = () => {
    if(inCode){
      const code = codeBuffer.join("\n");
      const highlighted = highlightCode(code, codeLang);
      html += `<pre><code class="language-${esc(codeLang)}">${highlighted}</code></pre>\n`;
      inCode = false;
      codeBuffer = [];
      codeLang = "";
    }
  };
  
  const closeList = () => {
    if(inList){
      html += listType === "ol" ? "</ol>\n" : "</ul>\n";
      inList = false;
      listType = null;
    }
  };
  
  const closeBlockquote = () => {
    if(inBlockquote){
      html += "</blockquote>\n";
      inBlockquote = false;
    }
  };

  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    
    // Code fence
    const fenceMatch = line.match(/^```(\w*)/);
    if(fenceMatch){
      closeCode();
      inCode = true;
      codeLang = fenceMatch[1] || "text";
      continue;
    }
    if(inCode && line.startsWith("```")){
      closeCode();
      continue;
    }
    if(inCode){
      codeBuffer.push(line);
      continue;
    }
    
    // Headers
    const hMatch = line.match(/^(#{1,6})\s+(.*)/);
    if(hMatch){
      closeList(); closeBlockquote();
      const level = hMatch[1].length;
      html += `<h${level}>${inlineParse(esc(hMatch[2]))}</h${level}>\n`;
      continue;
    }
    
    // Horizontal rule
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){
      closeList(); closeBlockquote();
      html += "<hr>\n";
      continue;
    }
    
    // Blockquote
    const bqMatch = line.match(/^>\s?(.*)/);
    if(bqMatch){
      closeList();
      if(!inBlockquote){ html += "<blockquote>\n"; inBlockquote = true; }
      html += inlineParse(esc(bqMatch[1])) + "<br>\n";
      continue;
    } else {
      closeBlockquote();
    }
    
    // Lists
    const ulMatch = line.match(/^(\s*)([-*+])\s+(.*)/);
    const olMatch = line.match(/^(\s*)(\d+)\.\s+(.*)/);
    if(ulMatch || olMatch){
      if(!inList || (ulMatch && listType==="ol") || (olMatch && listType==="ul")){
        closeList();
        inList = true;
        listType = ulMatch ? "ul" : "ol";
        html += listType === "ol" ? "<ol>\n" : "<ul>\n";
      }
      const content = ulMatch ? ulMatch[3] : olMatch[3];
      html += `<li>${inlineParse(esc(content))}</li>\n`;
      continue;
    } else {
      closeList();
    }
    
    // Table
    const pipeMatch = line.match(/^\|(.*)\|$/);
    if(pipeMatch && i+1 < lines.length && /^\|[\s\-\|:]+\|$/.test(lines[i+1])){
      closeList(); closeBlockquote();
      const headers = pipeMatch[1].split("|").map(c=>c.trim());
      const alignRow = lines[i+1];
      const aligns = alignRow.split("|").slice(1,-1).map(c=>{
        const t = c.trim();
        if(t.startsWith(":") && t.endsWith(":")) return ' style="text-align:center"';
        if(t.endsWith(":")) return ' style="text-align:right"';
        return "";
      });
      html += "<table><thead><tr>";
      headers.forEach((h,idx)=>html+=`<th${aligns[idx]||""}>${inlineParse(esc(h))}</th>`);
      html += "</tr></thead><tbody>";
      i+=2;
      while(i<lines.length && (line=lines[i]).match(/^\|.*\|$/)){
        const cells = line.split("|").slice(1,-1).map(c=>c.trim());
        html += "<tr>";
        cells.forEach((c,idx)=>html+=`<td${aligns[idx]||""}>${inlineParse(esc(c))}</td>`);
        html += "</tr>";
        i++;
      }
      i--;
      html += "</tbody></table>\n";
      continue;
    }
    
    // Paragraph / text
    if(line.trim() === ""){
      html += "\n";
    } else {
      closeList(); closeBlockquote();
      html += `<p>${inlineParse(esc(line))}</p>\n`;
    }
  }
  
  closeCode(); closeList(); closeBlockquote();
  
  // Post-process: merge consecutive <p> separated by single \n into one with <br>
  html = html.replace(/<\/p>\n<p>/g, "</p>\n<p>");
  
  return html;
}

function inlineParse(text){
  // Code spans
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  text = text.replace(/_(.+?)_/g, '<em>$1</em>');
  // Strikethrough
  text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // Links
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Images
  text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
  // Auto-link URLs
  text = text.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return text;
}

/* --- Minimal Syntax Highlighter --- */
const HL_KEYWORDS = new Set(["if","else","for","while","return","function","const","let","var","class","extends","import","export","from","as","async","await","try","catch","finally","throw","new","this","super","typeof","instanceof","in","of","void","delete","yield","default","case","switch","break","continue","do","interface","type","enum","public","private","protected","static","abstract","readonly","declare","module","namespace","require","define"]);
const HL_TYPES = new Set(["string","number","boolean","void","null","undefined","any","never","unknown","object","Array","Promise","Map","Set","RegExp","Date","Error","JSON","Math","console","window","document","fetch","localStorage","sessionStorage"]);
const HL_LITERALS = new Set(["true","false","null","undefined","NaN","Infinity"]);

function highlightCode(code, lang){
  if(!code) return "";
  const esc = s => s.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
  const out = [];
  
  // Simple state machine for common patterns
  let i = 0;
  while(i < code.length){
    const ch = code[i];
    
    // Comments
    if(ch === "/" && i+1 < code.length && code[i+1] === "/"){
      let j = i;
      while(j < code.length && code[j] !== "\n") j++;
      out.push(`<span class="hljs-comment">${esc(code.slice(i,j))}</span>`);
      i = j;
      continue;
    }
    if(ch === "/" && i+1 < code.length && code[i+1] === "*"){
      let j = i+2;
      while(j < code.length-1 && !(code[j] === "*" && code[j+1] === "/")) j++;
      j += 2;
      out.push(`<span class="hljs-comment">${esc(code.slice(i,j))}</span>`);
      i = j;
      continue;
    }
    
    // Strings
    if(ch === '"' || ch === "'" || ch === "`"){
      const quote = ch;
      let j = i+1;
      let escaped = false;
      while(j < code.length){
        if(code[j] === "\\"){ escaped = !escaped; j++; continue; }
        if(!escaped && code[j] === quote) break;
        escaped = false;
        j++;
      }
      j++;
      out.push(`<span class="hljs-string">${esc(code.slice(i,j))}</span>`);
      i = j;
      continue;
    }
    
    // Numbers
    if(/\d/.test(ch) && (i===0 || !/[a-zA-Z_$]/.test(code[i-1]))){
      let j = i;
      while(j < code.length && /[\d\.eE+\-]/.test(code[j])) j++;
      out.push(`<span class="hljs-number">${esc(code.slice(i,j))}</span>`);
      i = j;
      continue;
    }
    
    // Identifiers / keywords
    if(/[a-zA-Z_$]/.test(ch)){
      let j = i;
      while(j < code.length && /[a-zA-Z0-9_$]/.test(code[j])) j++;
      const word = code.slice(i,j);
      let cls = "";
      if(HL_KEYWORDS.has(word)) cls = "hljs-keyword";
      else if(HL_TYPES.has(word)) cls = "hljs-type";
      else if(HL_LITERALS.has(word)) cls = "hljs-literal";
      else if(j < code.length && code[j] === "(") cls = "hljs-title";
      out.push(cls ? `<span class="${cls}">${esc(word)}</span>` : esc(word));
      i = j;
      continue;
    }
    
    // Operators / punctuation
    out.push(esc(ch));
    i++;
  }
  
  return out.join("");
}

function renderTemplates(){
  $("templates").innerHTML = TEMPLATES.map((t,i)=>`<button data-i="${i}">${t.name}</button>`).join("");
  $("templates").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if($("editor").value.trim() && !confirm("Replace current content?")) return;
    $("editor").value = TEMPLATES[+b.dataset.i].content;
    update();
  });
}

function update(){
  const md = $("editor").value;
  $("preview").innerHTML = markdownToHtml(md);
  updateStats(md);
}

function updateStats(md){
  const words = md.trim() ? md.trim().split(/\s+/).length : 0;
  const chars = md.length;
  const lines = md.split("\n").length;
  const readTime = Math.ceil(words / 200);
  $("wordCount").textContent = `${words} word${words!==1?"s":""}`;
  $("charCount").textContent = `${chars} char${chars!==1?"s":""}`;
  $("lineCount").textContent = `${lines} line${lines!==1?"s":""}`;
  $("readTime").textContent = `${readTime} min read`;
}

function applyTheme(){
  const theme = $("theme").value;
  document.body.dataset.mdTheme = theme;
  update();
}

$("editor").addEventListener("input", update);
$("theme").onchange = applyTheme;

$("clearBtn").onclick = ()=>{
  if(confirm("Clear editor?")){ $("editor").value=""; update(); }
};
$("copyMd").onclick = ()=>{ navigator.clipboard.writeText($("editor").value); $("copyMd").textContent="Copied!"; setTimeout(()=>$("copyMd").textContent="Copy Markdown",1000); };
$("copyHtml").onclick = ()=>{ navigator.clipboard.writeText($("preview").innerHTML); $("copyHtml").textContent="Copied!"; setTimeout(()=>$("copyHtml").textContent="Copy HTML",1000); };
$("downloadBtn").onclick = ()=>{
  const blob = new Blob([$("editor").value], {type:"text/markdown"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `note-${Date.now()}.md`; a.click();
  URL.revokeObjectURL(url);
};
$("openBtn").onclick = ()=>$("fileInput").click();
$("fileInput").onchange = (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{ $("editor").value = reader.result; update(); };
  reader.readAsText(f);
  e.target.value = "";
};

let lastScroll = {editor:0, preview:0};
$("editor").addEventListener("scroll",()=>{
  if(!$("syncScroll").checked) return;
  const pct = $("editor").scrollTop / ($("editor").scrollHeight - $("editor").clientHeight);
  $("preview").scrollTop = pct * ($("preview").scrollHeight - $("preview").clientHeight);
});
$("preview").addEventListener("scroll",()=>{
  if(!$("syncScroll").checked) return;
  const pct = $("preview").scrollTop / ($("preview").scrollHeight - $("preview").clientHeight);
  $("editor").scrollTop = pct * ($("editor").scrollHeight - $("editor").clientHeight);
});

function loadSaved(){
  try{
    const saved = localStorage.getItem("pocketos.markdown");
    if(saved) $("editor").value = saved;
  }catch{}
  update();
}
setInterval(()=>{ try{localStorage.setItem("pocketos.markdown", $("editor").value);}catch{} }, 2000);

renderTemplates();
applyTheme();
</script>
</body>
</html>
